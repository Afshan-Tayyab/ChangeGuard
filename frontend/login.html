<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ChangeGuard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50; /* Dark blue matching your header */
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #2c3e50;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: bold;
            font-size: 0.9em;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #27ae60;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background-color: #2ecc71;
        }

        .error-msg {
            color: #e74c3c;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
            display: none;
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #7f8c8d;
        }
        
        .register-link a {
            color: #27ae60;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>🛡️ ChangeGuard</h1>
            <p>NLP-Based Semantic Change Detection</p>
        </div>

        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <button class="btn-login" onclick="login()">Login to Dashboard</button>
        
        <p id="errorMsg" class="error-msg">Invalid credentials. Please try again.</p>
        
        <div class="register-link">
            Don't have an account? <a href="#" onclick="register()">Create one here</a>
        </div>
    </div>

    <script>
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const err = document.getElementById('errorMsg');

            if (!user || !pass) {
                err.innerText = "Please fill in all fields.";
                err.style.display = 'block';
                return;
            }

            try {
                // Calls the FastAPI /login endpoint
                const response = await fetch(`/login?username=${user}&password=${pass}`, {
                    method: 'POST'
                });

                if (response.ok) {
                    // Save user to localStorage for the dashboard to read
                    localStorage.setItem('user', user);
                    // Redirect to the dashboard
                    window.location.href = '/app/';
                } else {
                    err.innerText = "Invalid username or password.";
                    err.style.display = 'block';
                }
            } catch (error) {
                err.innerText = "Server error. Is the backend running?";
                err.style.display = 'block';
            }
        }

        async function register() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const err = document.getElementById('errorMsg');

            if (!user || !pass) {
                err.innerText = "Enter a username and password to register.";
                err.style.display = 'block';
                return;
            }

            try {
                // Calls the FastAPI /register endpoint
                const response = await fetch(`/register?username=${user}&password=${pass}`, {
                    method: 'POST'
                });

                if (response.ok) {
                    err.style.color = "#27ae60";
                    err.innerText = "Account created! You can now log in.";
                    err.style.display = 'block';
                } else {
                    err.innerText = "Username already exists.";
                    err.style.display = 'block';
                }
            } catch (error) {
                err.innerText = "Server error.";
                err.style.display = 'block';
            }
        }
    </script>
</body>
</html>
