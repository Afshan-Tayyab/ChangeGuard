<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChangeGuard - Semantic Change Detection</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>🛡️ ChangeGuard</h1>
        <p>NLP-Based Context-Aware Semantic Change Detection System</p>
    </header>

    <main>
        <div class="input-section">
            <div class="box">
                <h2>Old Document</h2>
                <input type="file" id="oldFile" accept=".txt,.pdf,.docx" class="file-input">
                <p id="oldFileName" class="file-name">No file selected</p>
            </div>
            <div class="box">
                <h2>New Document</h2>
                <input type="file" id="newFile" accept=".txt,.pdf,.docx" class="file-input">
                <p id="newFileName" class="file-name">No file selected</p>
            </div>
        </div>

        <button id="compareBtn" onclick="compareDocuments()">Compare Documents</button>

        <div id="loading" class="hidden">Extracting text & analyzing with spaCy NLP...</div>

        <div id="resultsSection" class="hidden">
            <h2>Comparison Results</h2>
            <div id="resultsContainer"></div>
        </div>
    </main>

    <script src="/script.js"></script>
</body>
</html>
